description = "Add your description here"
readme = "README.md"
authors = [
    { name = "prthm45-kanha", email = "agrawalpratham2706@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.1",
    "langchain>=1.4.6",
